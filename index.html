<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sun — the solar system at true scale</title>

<!-- Installable, so it can be opened from the Dock in its own window with no
     browser round it. Chrome and Edge offer "Install"; Safari 17 and later has
     "Add to Dock" in the share menu. -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sun" />
<style>
  :root {
    --hud: #7fe9c8;
    --hud-dim: #4a8c7a;
    --hud-bright: #d8fff2;
    --warn: #ffb545;
    --danger: #ff5a4a;
    --panel-bg: rgba(4, 14, 12, 0.62);
    --panel-border: rgba(127, 233, 200, 0.28);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: var(--mono);
    color: var(--hud);
    -webkit-font-smoothing: antialiased;
  }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.03em;
  }

  @media (max-height: 780px) {
    #nav { top: auto; bottom: 190px; }
    #timepanel { bottom: 12px; }
  }

  .panel {
    position: absolute;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 8px 10px;
    backdrop-filter: blur(3px);
    pointer-events: auto;
  }

  .panel h2 {
    margin: 0 0 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--hud-dim);
    text-transform: uppercase;
  }

  .row { display: flex; justify-content: space-between; gap: 14px; white-space: nowrap; }
  .row .k { color: var(--hud-dim); }
  .row .v { color: var(--hud-bright); font-variant-numeric: tabular-nums; }

  .big { font-size: 21px; line-height: 1.15; color: var(--hud-bright); font-variant-numeric: tabular-nums; }
  .sub { font-size: 11px; color: var(--hud-dim); }

  #flight { top: 12px; left: 12px; min-width: 236px; }
  #sights { top: 12px; right: 12px; width: 262px; }
  #nav { top: 296px; right: 12px; width: 262px; }
  #console { bottom: 12px; left: 12px; min-width: 300px; }
  #timepanel { bottom: 12px; right: 12px; width: 262px; }

  /* Simple view: one panel of instruments, the sights, and nothing else. */
  /* The default view is the view. Nothing is drawn over the window except the
     one panel you steer from, and that fades out while you fly. */
  #hud.simple #nav,
  #hud.simple #timepanel,
  #hud.simple #console,
  #hud.simple #flight,
  #hud.simple #markers,
  #hud.simple #warnings,
  #hud.simple #reticle,
  #hud.simple #mousehint,
  #hud.simple .full { display: none !important; }

  /* Idle fade: the panel is there when you reach for it and gone when you are
     looking at something. */
  #hud.simple #sights {
    transition: opacity 900ms ease;
    opacity: 1;
  }
  #hud.simple.idle #sights { opacity: 0; pointer-events: none; }
  body.idle, body.idle #scene { cursor: none; }

  /* Engineering readouts stay out of the way until asked for. */
  #hud:not(.advanced) .adv { display: none !important; }
  #hud:not(.advanced) #console .row,
  #hud:not(.advanced) #console h2 { display: none; }
  #hud.advanced #nav { top: 296px; }

  /* The flight readout is an instrument panel, and the simple view is not
     flying by instruments. It comes back with the full console. */
  #hud.simple #flight { display: none; }

  /* Throttle / progress bars */
  .bar {
    height: 4px;
    background: rgba(127, 233, 200, 0.14);
    border-radius: 2px;
    overflow: hidden;
    margin: 6px 0 3px;
  }
  .bar .fill {
    height: 100%;
    width: 0;
    background: var(--hud);
    transition: width 0.12s linear;
  }
  .bar .fill.warn { background: var(--warn); }

  button.wide {
    display: block;
    width: 100%;
    text-align: left;
    margin-top: 4px;
  }

  button {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--hud);
    background: rgba(127, 233, 200, 0.07);
    border: 1px solid var(--panel-border);
    border-radius: 2px;
    padding: 3px 7px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  button:hover { background: rgba(127, 233, 200, 0.2); color: var(--hud-bright); }
  button.on { background: var(--hud); color: #04120e; border-color: var(--hud); }
  button:disabled { opacity: 0.35; cursor: default; }

  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .sep { height: 1px; background: var(--panel-border); margin: 7px 0; }

  select {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--hud-bright);
    background: rgba(4, 20, 16, 0.9);
    border: 1px solid var(--panel-border);
    border-radius: 2px;
    padding: 2px 4px;
    width: 100%;
  }

  input[type=range] { width: 100%; accent-color: var(--hud); }

  /* Reticle */
  #reticle {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    opacity: 0.5;
  }
  #reticle::before, #reticle::after {
    content: ''; position: absolute; background: var(--hud);
  }
  #reticle::before { left: 50%; top: 0; width: 1px; height: 8px; }
  #reticle::after { left: 50%; bottom: 0; width: 1px; height: 8px; }

  #markers { position: absolute; inset: 0; }
  .marker {
    position: absolute;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    font-size: 9px;
    color: var(--hud);
    display: flex; align-items: center; justify-content: center;
    opacity: 0.85;
  }
  .marker.prograde { color: #8fe9ff; }
  .marker.retrograde { color: #ff9a7a; }
  .marker.target { color: var(--warn); }
  .marker .glyph {
    width: 14px; height: 14px;
    border: 1px solid currentColor;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
  }
  .marker.square .glyph { border-radius: 1px; }
  .marker .lbl {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    font-size: 8px; letter-spacing: 0.1em; white-space: nowrap; opacity: 0.8;
  }

  .scalenote {
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--hud-bright);
    opacity: 0.75;
  }


  #mousehint {
    position: absolute;
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.14em;
    color: var(--hud-dim);
    opacity: 0.65;
    transition: color 0.2s, opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  #mousehint.locked { color: var(--warn); opacity: 0.95; }

  #warnings {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  .warn-line {
    font-size: 13px; letter-spacing: 0.2em; font-weight: 600;
    color: var(--warn); margin: 2px 0;
    text-shadow: 0 0 12px rgba(255, 181, 69, 0.5);
  }
  .warn-line.danger { color: var(--danger); text-shadow: 0 0 12px rgba(255, 90, 74, 0.6); }
  .blink { animation: blink 0.9s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  #overlay {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    pointer-events: auto;
  }
  #overlay.show { display: flex; }
  #overlay .box {
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    padding: 26px 34px;
    text-align: center;
    max-width: 760px;
    max-height: 88vh;
    overflow-y: auto;
  }
  #overlay h1 {
    margin: 0 0 10px; font-size: 26px; letter-spacing: 0.28em; color: var(--danger);
  }
  #overlay.help h1 { color: var(--hud-bright); font-size: 17px; }
  #overlay .box p { margin: 6px 0; color: var(--hud); }

  .keys { text-align: left; column-count: 2; column-gap: 34px; margin-top: 12px; }
  .keys div { break-inside: avoid; margin: 2px 0; white-space: nowrap; }
  .keys kbd {
    display: inline-block; min-width: 54px;
    color: var(--hud-bright); border: 1px solid var(--panel-border);
    border-radius: 2px; padding: 0 4px; margin-right: 8px;
    font-size: 10px; text-align: center;
  }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: var(--hud); font-size: 13px; letter-spacing: 0.2em;
  }
  #loading.hide { display: none; }

  .hint { color: var(--hud-dim); font-size: 10px; margin-top: 6px; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud"></div>
  <div id="loading">INITIALISING FLIGHT SYSTEMS…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
